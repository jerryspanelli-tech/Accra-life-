name: Character browser verification
on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'babylon.html'
      - 'systems/online/**'
      - 'accra-start.js'
      - 'interface/**'
      - 'characters/**'
      - 'gameplay/**'
      - 'world/**'
      - 'assets/**'
      - 'test-*.html'
      - 'test-accra-npc-preview.html'
      - 'scripts/npc-browser-test.cjs'
      - 'People/AccraLife/**'
      - 'test-accra-characters.html'
      - 'scripts/character-browser-test.cjs'
      - 'scripts/transport-route-test.cjs'
      - '.github/workflows/test-character-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium and Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Check account and startup JavaScript syntax
        run: |
          node --check systems/online/accra-auth.js
          node --check accra-start.js
          node --check accra-life.js
          node --check interface/accra-settings.js
          node --check characters/accra-people.js
          node --check systems/online/online.js
          node --check gameplay/accra-crime.js
          node --check assets/accra-assets.js
          node --check world/region/accra-world.js
          node --check world/region/accra-towns.js
          node --check world/transport/accra-roads.js
          node --check world/transport/accra-connect.js
          node --check world/transport/accra-highway.js
          node --check world/transport/accra-traffic.js
          node --check world/transport/accra-transport.js
          node --check world/transport/accra-shaxi.js
          node --check world/transport/accra-toll.js
          node --check world/transport/accra-airport.js
          node --check world/transport/accra-kumasi-airport.js
          node scripts/transport-route-test.cjs
      - name: Start local game server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/accra-http.log 2>&1 &
          echo $! >/tmp/accra-http.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/test-accra-characters.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/accra-http.log
          exit 1
      - name: Test male, female, Walk and Run in Babylon.js
        run: node scripts/character-browser-test.cjs
      - name: Test real 3D NPC models and animations
        run: node scripts/npc-browser-test.cjs
