name: Build Accra Life character GLB assets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-character-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Accra Life character presets
        uses: actions/checkout@v4
        with:
          ref: feature/realistic-npc-model-lab
          path: game

      - name: Checkout pinned Ara 3D Gen exporter
        uses: actions/checkout@v4
        with:
          repository: olatunde85/3d-gen
          ref: a4947ffdd14acf2ff018cb3568c941595f86d86e
          path: generator

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: generator/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Install generator dependencies
        working-directory: generator
        run: pnpm install --frozen-lockfile

      - name: Download CC0 MakeHuman source assets
        working-directory: generator
        run: pnpm run setup-assets

      - name: Export tested male and female wardrobe variants
        working-directory: generator
        run: |
          mkdir -p ../game/generated-character-assets
          for preset in \
            accra-player-male-northern-tunic \
            accra-player-male-streetwear-braids \
            accra-player-female-streetwear-braids \
            accra-player-female-ankara-peplum \
            accra-player-female-aso-ebi
          do
            pnpm run export -- --params "../game/character-pipeline/${preset}.params.json" --formats glb --out "../game/generated-character-assets"
          done

      - name: Upload generated GLB assets
        uses: actions/upload-artifact@v4
        with:
          name: accra-life-character-glb-assets
          path: game/generated-character-assets/*.glb
          if-no-files-found: error
          retention-days: 30
