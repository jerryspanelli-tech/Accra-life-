name: Accra Life character pipeline check

"on":
  push:
    branches:
      - feature/character-selection-sync
    paths:
      - ".github/workflows/build-accra-characters.yml"
      - "character-pipeline/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the branch workflow starts
        run: echo "Accra Life character asset pipeline is running on the feature branch."
