<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Accra Life · 3D NPC Preview</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8d0dc;font:14px system-ui;color:#fff}#view{width:100%;height:100%;display:block;touch-action:none}
#panel{position:fixed;left:12px;right:12px;top:12px;z-index:5;background:#17191ddd;border:1px solid #c9a54a;border-radius:16px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}#status{flex-basis:100%;font-size:12px;color:#eee}
</style></head><body><canvas id="view"></canvas><div id="panel"><b>ACCRA LIFE · REAL 3D NPC TEST</b><span id="status">Loading five rigged NPC models…</span></div>
<script src="https://cdn.babylonjs.com/babylon.js?version=7.34.0"></script><script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js?version=7.34.0"></script>
<script>
var scene,engine;
(function(){
 const canvas=document.getElementById('view'),status=document.getElementById('status');
 engine=new BABYLON.Engine(canvas,true,{adaptToDeviceRatio:true});
 if(/iPhone|iPad|Android/i.test(navigator.userAgent))engine.setHardwareScalingLevel(1.5);
 scene=new BABYLON.Scene(engine);scene.clearColor=new BABYLON.Color4(.68,.78,.82,1);
 const hemi=new BABYLON.HemisphericLight('hemi',new BABYLON.Vector3(0,1,0),scene);hemi.intensity=.9;
 const sun=new BABYLON.DirectionalLight('sun',new BABYLON.Vector3(-.4,-1,-.5),scene);sun.position.set(5,10,8);sun.intensity=1.1;
 const ground=BABYLON.MeshBuilder.CreateGround('ground',{width:18,height:12},scene);
 const gm=new BABYLON.StandardMaterial('groundMat',scene);gm.diffuseColor=new BABYLON.Color3(.32,.39,.34);ground.material=gm;
 const camera=new BABYLON.ArcRotateCamera('camera',-Math.PI/2,1.18,11,new BABYLON.Vector3(0,.9,0),scene);
 camera.lowerRadiusLimit=7;camera.upperRadiusLimit=17;camera.attachControl(canvas,true);
 window.__npcTestResults=[];
 window.__npcTestReady=false;
 window.__npcTestErrors=[];
 window.addEventListener('error',e=>window.__npcTestErrors.push(e.message));
})();
</script>
<script src="accra-people.js?v=65"></script>
<script>
(async()=>{
 const specs=[
  {label:'Male streetwear',x:-4,options:{gender:'male',outfit:'street'}},
  {label:'Female Ankara',x:-2,options:{gender:'female',outfit:'ankara'}},
  {label:'Male Kente',x:0,options:{gender:'male',outfit:'kente'}},
  {label:'Female suit',x:2,options:{gender:'female',outfit:'suit'}},
  {label:'Police',x:4,options:{police:true}}
 ];
 try{
  const actors=specs.map(s=>{
   const actor=window.ACCRA_PEOPLE.spawn(null,s.options);
   actor.root.position.x=s.x;
   return {spec:s,actor};
  });
  await Promise.all(actors.map(a=>a.actor.readyPromise));
  actors.forEach((a,i)=>{
   a.actor.setMoving(i%2===0?2:0);
   window.__npcTestResults.push({label:a.spec.label,model:a.actor.model(),ready:a.actor.ready(),animations:a.actor.animations()});
  });
  window.__npcTestReady=true;
  document.getElementById('status').textContent=window.__npcTestResults.length+' NPC models loaded · walk/idle animations active';
 }catch(e){
  window.__npcTestErrors.push(e.message);
  document.getElementById('status').textContent='NPC TEST ERROR: '+e.message;
  console.error(e);
 }
})();
</script>
<script>engine.runRenderLoop(()=>scene.render());addEventListener('resize',()=>engine.resize());</script>
</body></html>
